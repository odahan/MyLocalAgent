<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">Séquence d'exécution d'une tâche planifiée</title>
  <desc id="desc">Interactions depuis le Planificateur de tâches Windows jusqu'au rapport et à la prochaine occurrence.</desc>
  <defs>
    <marker id="callArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="returnArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 29px 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px 'Segoe UI', sans-serif; fill: #475569; }
      .participant { font: 700 13px 'Segoe UI', sans-serif; fill: #0f172a; }
      .life { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .call { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#callArrow); }
      .return { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#returnArrow); }
      .message { font: 400 12px 'Segoe UI', sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4; }
      .note { font: 400 12px 'Segoe UI', sans-serif; fill: #713f12; }
      .frame-title { font: 700 12px 'Segoe UI', sans-serif; fill: #6d28d9; }
      .frame-label { font: 600 12px 'Segoe UI', sans-serif; fill: #475569; }
      .activation { fill: #dbeafe; stroke: #60a5fa; }
    </style>
  </defs>
  <rect width="1600" height="1250" fill="#f8fafc"/>
  <text x="45" y="50" class="title">Séquence — exécution d'une tâche planifiée avec workflow</text>
  <text x="45" y="78" class="subtitle">Flux observé dans RunnerCommandHandlers et SequentialWorkflowEngine.</text>

  <!-- Participants -->
  <g filter="url(#shadow)">
    <rect x="35" y="110" width="160" height="58" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="115" y="135" text-anchor="middle" class="participant">Planificateur</text><text x="115" y="153" text-anchor="middle" class="participant">Windows</text>
    <rect x="245" y="110" width="180" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="335" y="135" text-anchor="middle" class="participant">RunnerCommand</text><text x="335" y="153" text-anchor="middle" class="participant">Handlers</text>
    <rect x="485" y="110" width="160" height="58" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="565" y="143" text-anchor="middle" class="participant">ITaskStore</text>
    <rect x="705" y="110" width="180" height="58" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="795" y="135" text-anchor="middle" class="participant">SequentialWorkflow</text><text x="795" y="153" text-anchor="middle" class="participant">Engine</text>
    <rect x="945" y="110" width="160" height="58" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="1025" y="135" text-anchor="middle" class="participant">StepFactory /</text><text x="1025" y="153" text-anchor="middle" class="participant">ToolRegistry</text>
    <rect x="1165" y="110" width="170" height="58" rx="8" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="1250" y="135" text-anchor="middle" class="participant">Agent / Skill /</text><text x="1250" y="153" text-anchor="middle" class="participant">outil concret</text>
    <rect x="1395" y="110" width="170" height="58" rx="8" fill="#fee2e2" stroke="#f87171"/>
    <text x="1480" y="135" text-anchor="middle" class="participant">IReportWriter /</text><text x="1480" y="153" text-anchor="middle" class="participant">Scheduler</text>
  </g>

  <!-- Lifelines -->
  <line x1="115" y1="168" x2="115" y2="1200" class="life"/><line x1="335" y1="168" x2="335" y2="1200" class="life"/>
  <line x1="565" y1="168" x2="565" y2="1200" class="life"/><line x1="795" y1="168" x2="795" y2="1200" class="life"/>
  <line x1="1025" y1="168" x2="1025" y2="1200" class="life"/><line x1="1250" y1="168" x2="1250" y2="1200" class="life"/>
  <line x1="1480" y1="168" x2="1480" y2="1200" class="life"/>

  <!-- Calls -->
  <path class="call" d="M 115 210 L 335 210"/><text x="155" y="201" class="message">lance Runner --run &lt;taskId&gt;</text>
  <rect x="328" y="210" width="14" height="935" class="activation"/>
  <path class="call" d="M 335 255 L 565 255"/><text x="380" y="246" class="message">GetAsync(taskId)</text>
  <rect x="558" y="255" width="14" height="55" class="activation"/>
  <path class="return" d="M 565 310 L 335 310"/><text x="425" y="302" class="message">ScheduledTask</text>

  <rect x="285" y="340" width="610" height="68" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="305" y="365" class="note">Préconditions : verrou interprocessus acquis, tâche trouvée et activée.</text>
  <text x="305" y="387" class="note">Le modèle de la tâche est placé dans ModelExecutionScope ; Ollama est préchauffé si nécessaire.</text>

  <path class="call" d="M 335 440 L 795 440"/><text x="500" y="431" class="message">ExecuteAsync(task, contextCallback)</text>
  <rect x="788" y="440" width="14" height="580" class="activation"/>

  <!-- Loop frame -->
  <rect x="735" y="480" width="600" height="500" rx="6" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 735 480 h 210 l -18 28 h -192 z" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="750" y="499" class="frame-title">loop — pour chaque WorkflowStepDefinition</text>

  <path class="call" d="M 795 535 L 1025 535"/><text x="835" y="526" class="message">Create(definition, registry)</text>
  <rect x="1018" y="535" width="14" height="65" class="activation"/>
  <path class="return" d="M 1025 600 L 795 600"/><text x="850" y="592" class="message">ToolStep | PromptStep | SkillStep</text>

  <rect x="770" y="625" width="535" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="790" y="650" class="frame-label">résolution</text>
  <text x="875" y="650" class="message">Substitue les sorties antérieures dans les arguments.</text>
  <text x="790" y="675" class="message">Calcule la politique d'erreur et les paramètres IA effectifs.</text>

  <rect x="770" y="720" width="535" height="190" rx="6" fill="none" stroke="#64748b"/>
  <path d="M 770 720 h 80 l -16 25 h -64 z" fill="#e2e8f0" stroke="#64748b"/>
  <text x="783" y="738" class="frame-label">alt</text>
  <text x="790" y="770" class="frame-label">[ToolStep]</text>
  <path class="call" d="M 795 790 L 1025 790"/><text x="840" y="781" class="message">InvokeAsync(alias, args, contexte)</text>
  <path class="call" d="M 1025 820 L 1250 820"/><text x="1060" y="811" class="message">appel de l'outil autorisé</text>
  <text x="790" y="850" class="frame-label">[SkillStep]</text>
  <path class="call" d="M 795 870 L 1250 870"/><text x="930" y="861" class="message">ISkill.ExecuteAsync(input)</text>
  <text x="790" y="900" class="frame-label">[PromptStep]</text>
  <path class="call" d="M 795 925 L 1250 925"/><text x="900" y="916" class="message">RunPromptWithoutToolsAsync(prompt, policy)</text>

  <path class="return" d="M 1250 950 L 795 950"/><text x="970" y="942" class="message">sortie ou exception</text>
  <text x="812" y="974" class="message">Succès : context.RecordOutput(step.Id, output) · Échec : stop, continue ou retry exponentiel</text>

  <path class="return" d="M 795 1020 L 335 1020"/><text x="520" y="1011" class="message">WorkflowResult</text>

  <path class="call" d="M 335 1060 L 1480 1060"/><text x="760" y="1051" class="message">IReportWriter.WriteAsync(task, result, provider)</text>
  <rect x="1473" y="1060" width="14" height="120" class="activation"/>
  <path class="return" d="M 1480 1100 L 335 1100"/><text x="835" y="1091" class="message">ReportWriteResult (Markdown + chemin)</text>
  <path class="call" d="M 335 1140 L 1480 1140"/><text x="780" y="1131" class="message">ITaskSchedulerService.RegisterAsync(task)</text>
  <path class="return" d="M 1480 1180 L 335 1180"/><text x="805" y="1171" class="message">prochaine occurrence enregistrée</text>
  <path class="return" d="M 335 1215 L 115 1215"/><text x="160" y="1206" class="message">code de sortie + journal</text>
</svg>
