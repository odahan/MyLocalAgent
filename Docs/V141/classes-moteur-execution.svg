<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de classes du moteur d'exécution</title>
  <desc id="desc">Interfaces, implémentations et relations principales du moteur de workflows, de l'agent et du registre d'outils.</desc>
  <defs>
    <marker id="association" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="inheritance" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 29px 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px 'Segoe UI', sans-serif; fill: #475569; }
      .class-name { font: 700 15px 'Segoe UI', sans-serif; fill: #0f172a; }
      .stereotype { font: italic 12px 'Segoe UI', sans-serif; fill: #475569; }
      .member { font: 400 12px Consolas, monospace; fill: #334155; }
      .relation { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#association); }
      .implements { fill: none; stroke: #334155; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#inheritance); }
      .inherits { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#inheritance); }
      .creates { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 3 5; marker-end: url(#association); }
      .label { font: 600 11px 'Segoe UI', sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5; }
      .purple { fill: #6d28d9; }
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#f8fafc"/>
  <text x="50" y="54" class="title">Moteur d'exécution — classes et responsabilités</text>
  <text x="50" y="82" class="subtitle">Vue volontairement centrée sur l'orchestration ; les DTO, options et outils concrets sont omis.</text>

  <!-- Interfaces -->
  <g filter="url(#shadow)">
    <rect x="60" y="125" width="250" height="120" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <line x1="60" y1="178" x2="310" y2="178" stroke="#38bdf8"/>
    <text x="185" y="149" text-anchor="middle" class="stereotype">«interface»</text>
    <text x="185" y="169" text-anchor="middle" class="class-name">IWorkflowEngine</text>
    <text x="75" y="203" class="member">+ ExecuteAsync(task)</text>
    <text x="75" y="224" class="member">  : WorkflowResult</text>

    <rect x="625" y="125" width="250" height="120" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <line x1="625" y1="178" x2="875" y2="178" stroke="#38bdf8"/>
    <text x="750" y="149" text-anchor="middle" class="stereotype">«interface»</text>
    <text x="750" y="169" text-anchor="middle" class="class-name">IToolRegistry</text>
    <text x="640" y="203" class="member">+ GetAgentTools(groups, context)</text>
    <text x="640" y="224" class="member">+ InvokeAsync(alias, args, context)</text>

    <rect x="1190" y="125" width="250" height="120" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <line x1="1190" y1="178" x2="1440" y2="178" stroke="#38bdf8"/>
    <text x="1315" y="149" text-anchor="middle" class="stereotype">«interface»</text>
    <text x="1315" y="169" text-anchor="middle" class="class-name">IMyLocalAgentService</text>
    <text x="1205" y="203" class="member">+ RunPromptAsync(...)</text>
    <text x="1205" y="224" class="member">+ RunPromptWithoutToolsAsync(...)</text>
  </g>

  <!-- Implementations -->
  <g filter="url(#shadow)">
    <rect x="40" y="350" width="330" height="185" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <line x1="40" y1="397" x2="370" y2="397" stroke="#4ade80"/>
    <text x="205" y="380" text-anchor="middle" class="class-name">SequentialWorkflowEngine</text>
    <text x="55" y="422" class="member">- toolRegistry: IToolRegistry</text>
    <text x="55" y="443" class="member">- agentService: IMyLocalAgentService</text>
    <text x="55" y="464" class="member">- skills: IReadOnlyList&lt;ISkill&gt;</text>
    <text x="55" y="485" class="member">+ ExecuteAsync(task)</text>
    <text x="55" y="506" class="member">- ExecuteWithPolicyAsync(step)</text>
    <text x="55" y="527" class="member">- ExecuteStepAsync(step)</text>

    <rect x="575" y="350" width="350" height="185" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <line x1="575" y1="397" x2="925" y2="397" stroke="#4ade80"/>
    <text x="750" y="380" text-anchor="middle" class="class-name">ToolRegistry</text>
    <text x="590" y="422" class="member">- catalog: IToolCatalog</text>
    <text x="590" y="443" class="member">- targetActivator: IToolTargetActivator</text>
    <text x="590" y="464" class="member">+ GetAgentTools(groups, context)</text>
    <text x="590" y="485" class="member">+ TryGetDefinition(alias)</text>
    <text x="590" y="506" class="member">+ InvokeAsync(alias, args, context)</text>
    <text x="590" y="527" class="member">- EnsureAuthorized(definition, context)</text>

    <rect x="1130" y="350" width="330" height="185" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <line x1="1130" y1="397" x2="1460" y2="397" stroke="#4ade80"/>
    <text x="1295" y="380" text-anchor="middle" class="class-name">MyLocalAgentService</text>
    <text x="1145" y="422" class="member">- clientFactory: ILlmClientFactory</text>
    <text x="1145" y="443" class="member">- toolRegistry: IToolRegistry</text>
    <text x="1145" y="464" class="member">- skills: IReadOnlyList&lt;ISkill&gt;</text>
    <text x="1145" y="485" class="member">+ RunPromptAsync(...)</text>
    <text x="1145" y="506" class="member">+ RunPromptStreamingAsync(...)</text>
    <text x="1145" y="527" class="member">- CreateAgentAsync(...)</text>
  </g>

  <!-- Workflow step hierarchy -->
  <g filter="url(#shadow)">
    <rect x="450" y="660" width="420" height="205" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <line x1="450" y1="708" x2="870" y2="708" stroke="#fbbf24"/>
    <text x="660" y="681" text-anchor="middle" class="stereotype">«abstract»</text>
    <text x="660" y="700" text-anchor="middle" class="class-name">WorkflowStep</text>
    <text x="465" y="733" class="member">+ Alias: string</text>
    <text x="465" y="754" class="member">+ Id: string</text>
    <text x="465" y="775" class="member">+ Args: JsonElement</text>
    <text x="465" y="796" class="member">+ OnError: WorkflowErrorPolicy?</text>
    <text x="465" y="817" class="member">+ RetryCount / RetryBackoffSeconds</text>
    <text x="465" y="838" class="member">+ GenerationOptions / Model</text>

    <rect x="80" y="910" width="270" height="60" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <text x="215" y="946" text-anchor="middle" class="class-name">ToolStep</text>
    <rect x="525" y="910" width="270" height="60" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <text x="660" y="946" text-anchor="middle" class="class-name">PromptStep</text>
    <rect x="970" y="910" width="270" height="60" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <text x="1105" y="935" text-anchor="middle" class="class-name">SkillStep</text>
    <text x="1105" y="955" text-anchor="middle" class="member">+ SkillName: string</text>

    <rect x="1030" y="660" width="350" height="130" rx="8" fill="#f3e8ff" stroke="#c084fc"/>
    <line x1="1030" y1="708" x2="1380" y2="708" stroke="#c084fc"/>
    <text x="1205" y="690" text-anchor="middle" class="class-name">WorkflowStepFactory</text>
    <text x="1045" y="734" class="member">+ Create(definition, registry)</text>
    <text x="1045" y="757" class="member">  : WorkflowStep</text>
  </g>

  <!-- Relations -->
  <path class="implements" d="M 185 350 L 185 245"/>
  <path class="implements" d="M 750 350 L 750 245"/>
  <path class="implements" d="M 1315 350 L 1315 245"/>
  <path class="relation" d="M 370 420 C 460 350, 520 330, 625 235"/>
  <text x="440" y="345" class="label">utilise</text>
  <path class="relation" d="M 370 465 C 650 585, 1050 580, 1190 235"/>
  <text x="910" y="570" class="label">exécute les invites</text>
  <path class="relation" d="M 1130 445 C 1010 445, 980 445, 925 445"/>
  <text x="985" y="434" class="label">obtient les outils</text>
  <path class="relation" d="M 205 535 C 270 610, 380 660, 450 720"/>
  <text x="290" y="617" class="label">orchestre 0..*</text>
  <path class="creates" d="M 1030 735 C 960 735, 930 735, 870 735"/>
  <text x="920" y="723" class="label purple">crée</text>
  <path class="inherits" d="M 215 910 C 250 865, 390 850, 500 835"/>
  <path class="inherits" d="M 660 910 L 660 865"/>
  <path class="inherits" d="M 1105 910 C 1000 865, 910 850, 820 835"/>
</svg>
